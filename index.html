<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Janken-pon</title>
    <link rel="icon" type="image/png" href="icons/favicon.png">
    <link href="style.css" rel="stylesheet" />
    <script href="script.js" defer></script>
  </head>

  <body>
    <div id="navbar">
      <h3>Janken-pon</h3>
      <ul>
        <li><a href="pages/about.html">About Game</a></li>
      </ul>
    </div>
    <hr class="horizontal-line">
    <div id="content">
      <div class="game">
        <div class="player">
          <h1>You</h1>
          <div class="rock">
            <button class="hrock">
              <img src="icons/rock.png" alt="image of rock move" />
            </button>
          </div>
          <div class="paper">
            <button class="hpaper">
              <img src="icons/paper.png" alt="image of paper move" />
            </button>
          </div>
          <div class="scissor">
            <button class="hscissor">
              <img src="icons/scissor.png" alt="image of scissor move" />
            </button>
          </div>
          <div class="score">
            <h2>Current score:</h2>
            <p class="hscore">0</p>
          </div>
        </div>
        <div class="verticleline"></div>
        <div class="computer">
          <h1>Comp</h1>
          <div class="rock">
            <button class="crock">
              <img src="icons/rock-inv.png" alt="image of rock move" />
            </button>
          </div>
          <div class="paper">
            <button class="cpaper">
              <img src="icons/paper-inv.png" alt="image of paper move" />
            </button>
          </div>
          <div class="scissor">
            <button class="cscissor">
              <img src="icons/scissor-inv.png" alt="image of scissor move" />
            </button>
          </div>
          <div class="score">
            <h2>Current score:</h2>
            <p class="cscore">0</p>
          </div>
        </div>
      </div>
    </div>
    <hr class="horizontal-line">
    <div id="footer">
      <p class="foottxt">Enjoy !! ☆*:.｡.o(≧▽≦)o.｡.:*☆</p>
      <p class="copyright">Copyright (c) 2025 M.Hashir</p>
    </div>
  </body>
</html>
